import gobley.gradle.rust.targets.RustPosixTarget
import java.util.Locale

plugins {
  id 'org.jetbrains.kotlin.multiplatform'
  alias(libs.plugins.kotlin.atomicfu)
  id 'dev.gobley.cargo' version '0.3.7'
  id 'dev.gobley.uniffi' version '0.3.7'
}

def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def archName = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def isMac = osName.contains("mac")
def isLinux = osName.contains("nux") || osName.contains("linux")
def isWindows = osName.contains("win")

def rustTargets = []

kotlin {
  applyDefaultHierarchyTemplate()

if (isMac) {
    if (archName.contains("aarch64") || archName.contains("arm64")) {
      macosArm64()
      rustTargets += RustPosixTarget.MacOSArm64
    } else {
      macosX64()
      rustTargets += RustPosixTarget.MacOSX64
    }
  }
  if (isLinux) {
    if (archName.contains("aarch64") || archName.contains("arm64")) {
      linuxArm64()
      rustTargets += RustPosixTarget.LinuxArm64
    } else {
      linuxX64()
      rustTargets += RustPosixTarget.LinuxX64
    }
  }
  if (isWindows) {
    mingwX64()
    rustTargets += RustPosixTarget.MinGWX64
  }

  sourceSets {
    commonMain {
      dependencies {
        implementation projects.redwoodWidget
        implementation projects.redwoodRuntime
        implementation projects.redwoodLayoutApi
        implementation projects.redwoodLayoutModifiers
        implementation projects.redwoodYoga
        implementation projects.redwoodUiBasicApi
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
      }
    }
  }
}

cargo {
  packageDirectory = rootProject.layout.projectDirectory.dir("../gpui-standalone/gpui-main/crates/gpui-uniffi")
}

if (rustTargets.isEmpty()) {
  throw new GradleException("Unsupported host OS for gpui bindings: ${System.getProperty('os.name')}")
}

uniffi {
  rustTargets.each { target ->
    generateFromLibrary {
      namespace = "gpui_uniffi"
      packageName = "app.cash.redwood.host.gpui"
      build = target
    }
  }
}
