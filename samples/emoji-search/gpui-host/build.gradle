import java.util.Locale

plugins {
  id 'org.jetbrains.kotlin.multiplatform'
  id 'org.jetbrains.kotlin.plugin.compose'
}

def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def archName = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def isMac = osName.contains("mac")
def isLinux = osName.contains("nux") || osName.contains("linux")
def isWindows = osName.contains("win")

kotlin {
  if (isMac) {
    if (archName.contains("aarch64") || archName.contains("arm64")) {
      macosArm64 {
        binaries {
          executable {
            entryPoint = 'com.example.redwood.emojisearch.gpui.main'
          }
        }
      }
    } else {
      macosX64 {
        binaries {
          executable {
            entryPoint = 'com.example.redwood.emojisearch.gpui.main'
          }
        }
      }
    }
  }
  if (isLinux) {
    if (archName.contains("aarch64") || archName.contains("arm64")) {
      linuxArm64 {
        binaries {
          executable {
            entryPoint = 'com.example.redwood.emojisearch.gpui.main'
          }
        }
      }
    } else {
      linuxX64 {
        binaries {
          executable {
            entryPoint = 'com.example.redwood.emojisearch.gpui.main'
          }
        }
      }
    }
  }
  if (isWindows) {
    mingwX64 {
      binaries {
        executable {
          entryPoint = 'com.example.redwood.emojisearch.gpui.main'
        }
      }
    }
  }

  sourceSets {
    commonMain {
      dependencies {
        // Inline presenter UI to avoid non-native deps.
        implementation projects.redwoodUiBasicCompose
        implementation projects.redwoodLazylayoutCompose
        implementation projects.redwoodCompose
        implementation libs.ktor.client.core
        implementation projects.redwoodHostGpui
        implementation projects.redwoodLayoutGpui
        implementation projects.redwoodUiBasicGpui
        implementation projects.redwoodLazylayoutGpui
        implementation projects.redwoodRuntime
        implementation projects.redwoodLayoutApi
        implementation projects.redwoodUiBasicApi
        implementation libs.kotlinx.serialization.json
      }
    }
    if (isMac) {
      // macOS engine dependency consolidated into shared macosMain
      maybeCreate("macosMain").dependencies {
        implementation libs.ktor.client.darwin
      }
    }
    if (isLinux) {
      // Linux engine dependency consolidated into shared linuxMain
      maybeCreate("linuxMain").dependencies {
        implementation libs.ktor.client.curl
      }
    }
    if (isWindows) {
      mingwX64Main {
        dependencies {
          implementation libs.ktor.client.winhttp
        }
      }
    }
  }
}
