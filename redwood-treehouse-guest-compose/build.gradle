import static app.cash.redwood.buildsupport.TargetGroup.TreehouseGuest

redwoodBuild {
  targets(TreehouseGuest)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'dev.gobley.wit-bindgen'

kotlin {
  // Enable Wasm/WASI target for the host-agnostic guest harness.
  wasmWasi() // library target; no component bindings in this module

  sourceSets {
    commonMain {
      dependencies {
        api projects.redwoodProtocolGuest
        api libs.androidx.compose.runtime
      }
    }
    // No special dependencies needed for WASI; uses commonMain.
  }
}
